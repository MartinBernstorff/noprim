source_roots = ["packages/noprim-core/src", "packages/noprim-io/src", "packages/noprim-cli/src"]
forbid_circular_dependencies = true

# pytest is a workspace-level dev dependency, not a dependency of any package.
[external]
exclude = ["pytest"]

[[modules]]
path = "noprim_core"
depends_on = []

[[modules]]
path = "noprim_io"
depends_on = ["noprim_core"]

[[modules]]
path = "noprim_cli"
depends_on = ["noprim_io", "noprim_core"]
