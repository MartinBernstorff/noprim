project-includes = ["packages/noprim-types/src", "packages/noprim-core/src", "packages/noprim-io/src", "packages/noprim-cli/src"]
project-excludes = ["**/.venv/**", "**/__pycache__/**"]
search-path = ["packages/noprim-types/src", "packages/noprim-core/src", "packages/noprim-io/src", "packages/noprim-cli/src"]
python-version = "3.11"
preset = "all"
permissive-ignores = false

# Verdict defines __bool__ so that it reads as the answer it is. Flagging that as an
# implicit conversion would make every if and filter spell out bool(...).
[errors]
implicit-bool = false
