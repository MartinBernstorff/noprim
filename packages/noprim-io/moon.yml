$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'noprim-io'
language: 'python'
stack: 'backend'
layer: 'library'
tags: ['python']

dependsOn:
  - 'noprim-core'

fileGroups:
  sources:
    - 'src/**/*.py'
  # The tasks that resolve imports across the boundary must be invalidated by the
  # upstream source too; dependsOn alone does not make it an input.
  upstream:
    - '/packages/noprim-core/src/**/*.py'
  manifests:
    - 'pyproject.toml'
    - '/uv.lock'

tasks:
  test:
    script: 'uv run pytest src'
    inputs:
      - '@group(sources)'
      - '@group(upstream)'
      - '@group(manifests)'
      - '/pytest.toml'

  lint:
    script: 'uv run ruff check .'
    inputs:
      - '@group(sources)'
      - '/ruff.toml'

  lint-fix:
    script: 'uv run ruff check --fix .'
    options:
      runInCI: false

  format-check:
    script: 'uv run ruff format --check .'
    inputs:
      - '@group(sources)'
      - '/ruff.toml'

  format:
    script: 'uv run ruff format .'
    options:
      runInCI: false

  typecheck:
    script: 'uv run pyrefly check src'
    inputs:
      - '@group(sources)'
      - '@group(upstream)'
      - '@group(manifests)'
      - '/pyrefly.toml'
