$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'noprim-io'
language: 'python'
stack: 'backend'
layer: 'library'
tags: ['python']

dependsOn:
  - 'noprim-core'

fileGroups:
  sources:
    - 'src/**/*.py'
  manifests:
    - 'pyproject.toml'
    - '/uv.lock'

tasks:
  # No `test` task yet: the package has no tests, and pytest exits 5 on an empty run.

  lint:
    script: 'uv run ruff check .'
    inputs:
      - '@group(sources)'
      - '/ruff.toml'

  lint-fix:
    script: 'uv run ruff check --fix .'
    options:
      runInCI: false

  format-check:
    script: 'uv run ruff format --check .'
    inputs:
      - '@group(sources)'
      - '/ruff.toml'

  format:
    script: 'uv run ruff format .'
    options:
      runInCI: false

  typecheck:
    script: 'uv run pyrefly check src'
    inputs:
      - '@group(sources)'
      - '@group(manifests)'
      - '/pyrefly.toml'
