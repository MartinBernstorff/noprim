$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'root'
language: 'python'
stack: 'backend'
layer: 'unknown'

fileGroups:
  sources:
    - 'packages/*/src/**/*.py'
  manifests:
    - 'pyproject.toml'
    - 'packages/*/pyproject.toml'
    - 'uv.lock'
  workflows:
    - '.github/workflows/*.yml'
    - '.github/dependabot.yml'
  templates:
    - 'docs-templates/**/*'
    - 'docs-support/**/*'

# documator requires Python 3.14 and this package supports 3.13, so it cannot be a dev
# dependency. Pinned to a rev because an unpinned default branch would let a change over
# there break a build over here with no commit to point at; bumping it is this one line.
env:
  DOCUMATOR: 'git+https://github.com/MartinBernstorff/documator@5ff3ee094493af8fe6c2b5bfe0431a13b88a1f9e'

tasks:
  # Boundaries span packages, so this cannot live in a single package.
  modularity:
    script: |
      set -euo pipefail
      uv run tach check
      uv run tach check-external
      # ruff has no rule for this: PLC0414 skips __init__.py, and F401 accepts `X as X`.
      # noprim_types is the exception: it is a public import surface, so its __all__
      # is the point rather than a second source of truth for internal callers.
      walls="$(find packages -path '*/src/*/__init__.py' -size +0c -not -path '*/noprim_types/__init__.py')"
      test -z "$walls" || {
        echo "__init__.py must stay empty; export lists drift:"
        echo "$walls"
        exit 1
      }
    inputs:
      - '@group(sources)'
      - '@group(manifests)'
      - 'tach.toml'

  actionlint:
    script: 'uv run actionlint'
    inputs:
      - '@group(workflows)'

  # The dev venv has every dependency installed, so only a clean venv catches a
  # dependency the root manifest forgot to declare.
  smoke:
    script: |
      set -euo pipefail
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      uv build --wheel --out-dir "$tmp/dist"
      wheel="$(find "$tmp/dist" -name '*.whl')"
      test -f "$wheel" || { echo "smoke: expected exactly one wheel"; exit 1; }
      printf 'def clean() -> None:\n    return None\n' > "$tmp/clean.py"
      printf 'def dirty(value: str) -> None:\n    return None\n' > "$tmp/dirty.py"
      uv venv "$tmp/venv"
      uv pip install --python "$tmp/venv" "$wheel"
      # An absolute path, because `uvx` and `uv run --with` both fall back to
      # PATH and would silently run the dev venv's noprim instead of the wheel's.
      bin="$tmp/venv/bin/noprim"
      test -x "$bin" || { echo "smoke: wheel exposes no noprim executable"; exit 1; }
      check() { "$bin" check "$1"; }
      check "$tmp/clean.py" || { echo "smoke: clean fixture should exit 0"; exit 1; }
      if check "$tmp/dirty.py"; then
        echo "smoke: violating fixture should exit non-zero"
        exit 1
      fi
      baseline="$tmp/.noprim.json"
      "$bin" check --baseline "$baseline" "$tmp/dirty.py" || {
        echo "smoke: writing a baseline should exit 0"
        exit 1
      }
      test -f "$baseline" || { echo "smoke: no baseline written"; exit 1; }
      "$bin" check --baseline "$baseline" "$tmp/dirty.py" || {
        echo "smoke: baselined fixture should exit 0"
        exit 1
      }
    inputs:
      - '@group(sources)'
      - '@group(manifests)'

  # Dogfooding: every rule on, no --allow flags. The doc fixtures are deliberately
  # full of violations, so they are the one thing not held to it.
  noprim:
    script: 'uv run noprim check --preset all --exclude "docs-support/fixtures/**" .'
    inputs:
      - '@group(sources)'
      - '@group(manifests)'

  # docs-support sits outside packages/*, so the per-package tasks never reach it.
  lint:
    script: 'uv run ruff check docs-support'
    inputs:
      - '@group(templates)'
      - 'ruff.toml'

  lint-fix:
    script: 'uv run ruff check --fix docs-support'
    options:
      runInCI: false

  format-check:
    script: 'uv run ruff format --check docs-support'
    inputs:
      - '@group(templates)'
      - 'ruff.toml'

  format:
    script: 'uv run ruff format docs-support'
    options:
      runInCI: false

  # The doc guards assert things about the rendered documents, which belong to no
  # package, so they are the root project's tests.
  test:
    script: 'uv run pytest docs-support'
    inputs:
      - '@group(templates)'
      - '@group(sources)'
      - '@group(manifests)'
      - 'README.md'
      - 'AGENTS.md'
      - 'moon.yml'
      - 'pytest.toml'

  docs:
    script: 'uvx --from "$DOCUMATOR" documator --quiet render docs-templates .'
    inputs:
      - '@group(templates)'
      - '@group(sources)'
      - '@group(manifests)'
    # Declared so a cache hit restores them: without this, a hand-edited README is
    # left in place by a render moon decided it could skip.
    outputs:
      - 'README.md'
      - 'AGENTS.md'
    options:
      runInCI: false

  # Reports a document that is stale, missing, or orphaned by a deleted template, and
  # writes none of them.
  docs-check:
    script: 'uvx --from "$DOCUMATOR" documator --quiet render --check docs-templates .'
    inputs:
      - '@group(templates)'
      - '@group(sources)'
      - '@group(manifests)'
      - 'README.md'
      - 'AGENTS.md'
