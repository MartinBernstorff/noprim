name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the tag and create the GitHub Release
      id-token: write # mandatory for PyPI trusted publishing
    # Under workflow_run, github.ref is always the default branch regardless of
    # what triggered the run, so head_branch is the only honest guard.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs and semantic-release both resolve versions from tag history

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Committing would write to protected main, which GITHUB_TOKEN cannot do.
          commit: false
          changelog: false

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        if: steps.release.outputs.released == 'true'
        with:
          auto-install: true

      # Runs after the tag exists, so hatch-vcs stamps the released version
      # rather than a dev version derived from the previous tag.
      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: uv build --out-dir dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.release.outputs.released == 'true'
