[project]
name = "noprim"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.11",
    "iterpy>=1.15",
    "pathspec>=0.12",
    "pydantic-settings>=2.15",
]

[project.scripts]
noprim = "noprim_cli.main:app"

# hatchling, not uv_build: uv_build's module-root is a single directory and
# cannot gather the module dirs under packages/*/src into one wheel.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/noprim-types/src/noprim_types",
    "packages/noprim-core/src/noprim_core",
    "packages/noprim-io/src/noprim_io",
    "packages/noprim-cli/src/noprim_cli",
]
# Tests live beside the code, so they would otherwise ship to every user.
exclude = ["test_*.py"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-xdist>=3",
    "pytest-randomly>=4",
    "pytest-testmon>=2",
    "pyrefly>=0.42",
    "tach>=0.30",
    "ruff>=0.14",
    "actionlint-py>=1.7",
    "lefthook>=1.13",
]
