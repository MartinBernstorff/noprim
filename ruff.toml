target-version = "py313"
line-length = 88
src = ["packages/noprim-core/src", "packages/noprim-io/src", "packages/noprim-cli/src"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "PIE",
    "PT",
    "RET",
    "TID",
    "PTH",
    "ARG",
    "ERA",
    "TRY",
    "PL",
    "A",
    "ASYNC",
    "FBT",
    "ISC",
    "LOG",
    "G",
    "INP",
    "T20",
    "Q",
    "SLF",
    "FURB",
    "PERF",
]
ignore = ["E501"]

[lint.per-file-ignores]
# Typer derives the interface from the command's signature, so its arity and its
# boolean flags are the CLI's, not a design choice to lint.
"packages/noprim-cli/src/**" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
"**/test_*.py" = ["PLR2004"]

[lint.isort]
known-first-party = ["noprim_core", "noprim_io", "noprim_cli"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
docstring-code-format = true
